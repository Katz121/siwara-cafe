<script>
/* ===================== hand-ink engine ===================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var R=mulberry32(90211);
function rr(a,b){return a+(b-a)*R();}
function f(n){return Math.round(n*10)/10;}
var DEFS=[],cid=0;
var DASHES=['26 3 70 4','18 2 44 3','52 3 30 2 90 4','120 5 40 3','60 2 22 3 48 2'];

/* single wobbling stroke */
function wpath(x1,y1,x2,y2,sw,o,attrs,boff){
  var len=Math.hypot(x2-x1,y2-y1)||1;
  var n=Math.max(2,Math.round(len/22));
  var dx=(x2-x1)/n, dy=(y2-y1)/n, L=Math.hypot(dx,dy)||1;
  var px=-dy/L, py=dx/L;
  boff=boff||0;
  var t0=boff+rr(-o,o);
  var d='M'+f(x1+px*t0)+' '+f(y1+py*t0);
  for(var i=1;i<=n;i++){
    var t1=boff+rr(-o,o), t2=boff+rr(-o,o);
    d+=' Q'+f(x1+dx*(i-0.5)+px*t1)+' '+f(y1+dy*(i-0.5)+py*t1)+' '+f(x1+dx*i+px*t2)+' '+f(y1+dy*i+py*t2);
  }
  return '<path d="'+d+'" stroke-width="'+f(sw)+'"'+(attrs||'')+'/>';
}
/* full hand-drawn line: overshoot + uneven weight + double pass + ghost + broken ink */
function wline(x1,y1,x2,y2,sw,o,opt){
  opt=opt||{}; if(o==null)o=1.0;
  var len=Math.hypot(x2-x1,y2-y1)||1;
  var ux=(x2-x1)/len, uy=(y2-y1)/len;
  var ov=(opt.over==null)?(len>26?rr(1.4,5.0):rr(0.4,1.8)):opt.over;
  var ax=x1-ux*rr(0.3,ov), ay=y1-uy*rr(0.3,ov);
  var bx=x2+ux*rr(0.3,ov), by=y2+uy*rr(0.3,ov);
  var W=Math.max(0.55,sw*rr(0.72,1.34));
  var out='';
  if(opt.ghost!==false && len>34 && R()<0.32)
    out+=wpath(ax-ux*4,ay-uy*4,bx+ux*4,by+uy*4,W*0.85,o*2.2,' opacity="'+f(rr(0.15,0.25))+'"',rr(-3,3));
  var dash='';
  if(opt.dash!==false && len>62 && R()<0.34)
    dash=' stroke-dasharray="'+DASHES[Math.floor(R()*DASHES.length)]+'"';
  out+=wpath(ax,ay,bx,by,W,o,dash);
  if(opt.dbl!==false && len>16 && R()<0.62)
    out+=wpath(ax+ux*rr(-2.5,2.5),ay+uy*rr(-2.5,2.5),bx+ux*rr(-2.5,2.5),by+uy*rr(-2.5,2.5),
               W*rr(0.55,0.9),o*0.9,' opacity="'+f(rr(0.45,0.72))+'"',rr(0.5,1.6)*(R()<0.5?-1:1));
  return out;
}
var THIN={dbl:false,ghost:false,dash:false,over:1.1};
function wrect(x,y,w,h,sw,o){
  return wline(x,y,x+w,y,sw*rr(0.85,1.15),o)+wline(x+w,y,x+w,y+h,sw*rr(0.8,1.1),o)+
         wline(x+w,y+h,x,y+h,sw*rr(0.9,1.2),o)+wline(x,y+h,x,y,sw*rr(0.8,1.1),o);
}
function wpoly(pts,sw,o,close){
  var out='';
  for(var i=1;i<pts.length;i++) out+=wline(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1],sw*rr(0.85,1.2),o);
  if(close) out+=wline(pts[pts.length-1][0],pts[pts.length-1][1],pts[0][0],pts[0][1],sw*rr(0.85,1.2),o);
  return out;
}
function smooth(pts,close){
  var d='M'+f(pts[0][0])+' '+f(pts[0][1]);
  for(var i=1;i<pts.length;i++){
    var p=pts[i-1],q=pts[i];
    d+=' Q'+f(p[0])+' '+f(p[1])+' '+f((p[0]+q[0])/2)+' '+f((p[1]+q[1])/2);
  }
  d+=' L'+f(pts[pts.length-1][0])+' '+f(pts[pts.length-1][1]);
  if(close)d+=' Z';
  return d;
}
function blobPts(cx,cy,r,n,amp){
  var pts=[];
  for(var i=0;i<=n;i++){
    var a=i/n*Math.PI*2, rad=r+Math.sin(i*2.7)*amp*0.5+rr(-amp,amp);
    pts.push([cx+Math.cos(a)*rad, cy+Math.sin(a)*rad*rr(0.88,0.97)]);
  }
  return pts;
}
function blob(cx,cy,r,sw,n,amp){
  n=n||18; amp=amp||6;
  var out='<path d="'+smooth(blobPts(cx,cy,r,n,amp),true)+'" stroke-width="'+f(sw*rr(0.85,1.25))+'"/>';
  if(R()<0.75) out+='<path d="'+smooth(blobPts(cx,cy,r*rr(0.98,1.02),n,amp*0.85),true)+
    '" stroke-width="'+f(sw*rr(0.5,0.8))+'" opacity="'+f(rr(0.42,0.7))+'"/>';
  if(R()<0.3) out+='<path d="'+smooth(blobPts(cx,cy,r*rr(0.96,1.05),n,amp*1.4),true)+
    '" stroke-width="'+f(sw*0.8)+'" opacity="0.2"/>';
  return out;
}
function polyPath(pts){
  var d='M'+f(pts[0][0])+' '+f(pts[0][1]);
  for(var i=1;i<pts.length;i++) d+='L'+f(pts[i][0])+' '+f(pts[i][1]);
  return d+'Z';
}
function rectPath(x,y,w,h){return 'M'+f(x)+' '+f(y)+'H'+f(x+w)+'V'+f(y+h)+'H'+f(x)+'Z';}
function clipDef(d){var id='c'+(cid++);DEFS.push('<clipPath id="'+id+'"><path d="'+d+'"/></clipPath>');return id;}
/* hand hatching: uneven spacing, uneven angle, uneven line length */
function hatch(shape,bbox,angle,gap,sw,color,op,wob){
  var id=clipDef(shape), out='';
  var a0=angle*Math.PI/180, nx=-Math.sin(a0), ny=Math.cos(a0);
  var cx=bbox[0]+bbox[2]/2, cy=bbox[1]+bbox[3]/2;
  var diag=Math.hypot(bbox[2],bbox[3])/2+gap*2;
  for(var t=-diag;t<=diag;t+=gap*rr(0.6,1.5)){
    var mx=cx+nx*t, my=cy+ny*t;
    var a=a0+rr(-0.055,0.055), dx=Math.cos(a), dy=Math.sin(a);
    var s1=diag*rr(0.66,1.0), s2=diag*rr(0.66,1.0);
    out+=wline(mx-dx*s1,my-dy*s1,mx+dx*s2,my+dy*s2,sw*rr(0.65,1.4),wob==null?0.85:wob,THIN);
  }
  return '<g clip-path="url(#'+id+')"'+(color?' stroke="'+color+'"':'')+(op?' opacity="'+op+'"':'')+'>'+out+'</g>';
}
function stipple(shape,bbox,count,rad,color,op){
  var id=clipDef(shape),out='';
  for(var i=0;i<count;i++)
    out+='<circle cx="'+f(bbox[0]+R()*bbox[2])+'" cy="'+f(bbox[1]+R()*bbox[3])+'" r="'+f(rad*(0.5+R()*0.95))+'"/>';
  return '<g clip-path="url(#'+id+')" fill="'+(color||'#241d19')+'" stroke="none" opacity="'+(op||0.5)+'">'+out+'</g>';
}
function stampPath(x,y,w,h,per){
  var nx=Math.round(w/per), ny=Math.round(h/per);
  var px=w/nx, py=h/ny, i, d='M'+x+' '+y;
  for(i=0;i<nx;i++) d+=' A'+f(px/2*rr(0.9,1.1))+' '+f(px/2)+' 0 0 0 '+f(x+px*(i+1))+' '+f(y+rr(-0.8,0.8));
  for(i=0;i<ny;i++) d+=' A'+f(py/2)+' '+f(py/2*rr(0.9,1.1))+' 0 0 0 '+f(x+w+rr(-0.8,0.8))+' '+f(y+py*(i+1));
  for(i=0;i<nx;i++) d+=' A'+f(px/2*rr(0.9,1.1))+' '+f(px/2)+' 0 0 0 '+f(x+w-px*(i+1))+' '+f(y+h+rr(-0.8,0.8));
  for(i=0;i<ny;i++) d+=' A'+f(py/2)+' '+f(py/2*rr(0.9,1.1))+' 0 0 0 '+f(x+rr(-0.8,0.8))+' '+f(y+h-py*(i+1));
  return d+' Z';
}
/* terracotta tile courses, uneven */
function tiles(pts,bbox,gapCourse,tickGap){
  var id=clipDef(polyPath(pts)),out='',y,row=0;
  for(y=bbox[1]+gapCourse*0.6;y<bbox[1]+bbox[3];y+=gapCourse*rr(0.82,1.22)){
    out+=wline(bbox[0]-8,y+rr(-1,1),bbox[0]+bbox[2]+8,y+rr(-1.5,1.5),rr(0.8,1.5),0.7,THIN);
  }
  for(y=bbox[1];y<bbox[1]+bbox[3];y+=gapCourse){
    var off=(row%2)?tickGap*rr(0.4,0.62):rr(-2,2); row++;
    for(var x=bbox[0]+off;x<bbox[0]+bbox[2];x+=tickGap*rr(0.85,1.2))
      out+=wline(x,y+2,x+rr(-1.5,1.5),y+gapCourse-rr(1,3),rr(0.6,1.1),0.5,THIN);
  }
  return '<g clip-path="url(#'+id+')" stroke="#b4451f">'+out+'</g>';
}
function siding(x,y,w,h,gap,sw){
  var out='';
  for(var yy=y+gap*rr(0.6,1.1);yy<y+h-3;yy+=gap*rr(0.78,1.24))
    out+=wline(x+rr(-2,3),yy,x+w-rr(-2,3),yy+rr(-1.2,1.2),sw*rr(0.7,1.5),0.75,{dbl:false,ghost:false});
  return out;
}
function window3x2(x,y,w,h){
  var out=wrect(x,y,w,h,2.4,1.0)+wrect(x+4,y+4.4,w-8,h-9,1.2,0.8);
  var mx=x+w/2+rr(-1.5,1.5);
  out+=wline(mx,y+4,mx,y+h-4,2.0,0.7);
  var lw=(w-8)/2;
  for(var s=0;s<2;s++){
    var lx=x+4+s*lw;
    for(var c=1;c<3;c++) out+=wline(lx+lw*c/3+rr(-1.5,1.5),y+6,lx+lw*c/3+rr(-1.5,1.5),y+h-6,rr(0.8,1.3),0.6,{dbl:false});
    out+=wline(lx,y+4+(h-8)*rr(0.45,0.55),lx+lw,y+4+(h-8)*rr(0.45,0.55),rr(0.8,1.3),0.6,{dbl:false});
  }
  out+=wline(x-6,y-4,x+w+5,y-4.6,2.1,0.9);
  out+=wline(x-8,y+h+4,x+w+7,y+h+4.8,2.5,0.9);
  out+=wline(x-8,y+h+4,x-3,y+h+12,1.5,0.7)+wline(x+w+7,y+h+4,x+w+2,y+h+12,1.5,0.7);
  out+=hatch(rectPath(x+4,y+4,lw,h-8),[x+4,y+4,lw,h-8],rr(34,42),7,0.8,'#241d19',0.32);
  return out;
}
function lamp(x,y,flip){
  var s=flip?-1:1,out='';
  out+=wline(x,y,x+18*s,y+rr(-1,1),2.0,0.7);
  out+=wline(x+18*s,y,x+18*s,y+9,1.8,0.6);
  out+=wpoly([[x+6*s,y+9],[x+30*s,y+10],[x+25*s,y+38],[x+11*s,y+37]],2.1,0.8,true);
  out+=wline(x+4*s,y+9,x+32*s,y+9.6,2.3,0.7);
  out+=wline(x+11*s,y+38,x+25*s,y+38,1.8,0.6);
  out+=wline(x+18*s,y+38,x+18*s,y+45,1.4,0.6);
  out+=wline(x+13*s,y+45,x+23*s,y+45,1.6,0.6);
  out+=wline(x+18*s,y+13,x+17*s,y+34,1.0,0.6);
  for(var i=0;i<3;i++) out+=wline(x+(34+i*3)*s,y+16+i*7,x+(45+i*4)*s,y+12+i*8,rr(0.9,1.4),0.6,{dbl:false});
  return out;
}
function bush(cx,cy,r){
  var out=blob(cx,cy,r,2.0,16,r*0.18);
  out+=hatch(smooth(blobPts(cx,cy,r*0.93,16,r*0.1),true),[cx-r,cy-r,r*2,r*2],rr(48,62),5.6,0.85,'#241d19',0.42);
  out+=wline(cx+rr(-2,2),cy+r*0.82,cx+rr(-2,2),cy+r*0.82+9,1.8,0.6);
  return out;
}

function ring(cx,cy,r,sw,amp){
  var pts=[],i2;
  for(i2=0;i2<=26;i2++){
    var a=i2/26*Math.PI*2, rad=r+Math.sin(i2*1.9)*amp*0.4+rr(-amp,amp);
    pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]);
  }
  var o='<path d="'+smooth(pts,true)+'" stroke-width="'+f(sw*rr(0.9,1.2))+'"/>';
  var q=[];
  for(i2=0;i2<=26;i2++){
    var b=i2/26*Math.PI*2, rd=r+rr(-amp*0.8,amp*0.8)+1.1;
    q.push([cx+Math.cos(b)*rd,cy+Math.sin(b)*rd]);
  }
  o+='<path d="'+smooth(q,true)+'" stroke-width="'+f(sw*0.62)+'" opacity="'+f(rr(0.45,0.68))+'"/>';
  return o;
}

}
