<script>
(function(){
var SVG="http://www.w3.org/2000/svg";
var INK="#241d19", BRK="#b4451f", CRM="#f4ece0";
var seed=20250809;
function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
function rr(a,b){ return a+rnd()*(b-a); }
function G(id){ return document.getElementById(id); }
function el(g,tag,at){ var e=document.createElementNS(SVG,tag); for(var k in at) e.setAttribute(k,at[k]); g.appendChild(e); return e; }
function fx(n){ return (Math.round(n*10)/10); }

/* ---------- hand-drawn primitives ---------- */
// one stroke, drawn twice, with overshoot past both ends and a slight bow
function line(g,x1,y1,x2,y2,sw,col,opt){
  opt=opt||{};
  var col2=col||INK;
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  var over=(opt.over===undefined)?1:opt.over;
  var passes=(opt.single)?1:2;
  var bowMax=Math.min(2.2, 0.6+L*0.02);
  for(var p=0;p<passes;p++){
    var o1=over?rr(1.5,4.6):rr(0,1), o2=over?rr(1.8,5.0):rr(0,1);
    var off=(p===0)?0:(rnd()<0.5?-1:1)*rr(0.8,1.8);
    var sx=x1-ux*o1+nx*off+rr(-0.8,0.8), sy=y1-uy*o1+ny*off+rr(-0.8,0.8);
    var ex=x2+ux*o2+nx*off+rr(-0.8,0.8), ey=y2+uy*o2+ny*off+rr(-0.8,0.8);
    var b1=rr(-bowMax,bowMax), b2=rr(-bowMax,bowMax);
    var c1x=sx+(ex-sx)/3+nx*b1, c1y=sy+(ey-sy)/3+ny*b1;
    var c2x=sx+(ex-sx)*2/3+nx*b2, c2y=sy+(ey-sy)*2/3+ny*b2;
    el(g,"path",{d:"M "+fx(sx)+","+fx(sy)+" C "+fx(c1x)+","+fx(c1y)+" "+fx(c2x)+","+fx(c2y)+" "+fx(ex)+","+fx(ey),
      "stroke-width":fx(sw*(p===0?rr(0.92,1.14):rr(0.66,0.86))), stroke:col2,
      "stroke-opacity":(p===0?1:fx(rr(0.5,0.7)))});
  }
}
function poly(g,pts,sw,col,closed){
  for(var i=0;i<pts.length-1;i++) line(g,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],sw*rr(0.9,1.12),col);
  if(closed) line(g,pts[pts.length-1][0],pts[pts.length-1][1],pts[0][0],pts[0][1],sw*rr(0.9,1.12),col);
}
function rectR(g,x,y,w,h,sw,col){
  poly(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],sw,col,true);
}
// catmull-rom through points
function crPath(pts,closed){
  var n=pts.length;
  function at(i){ return closed? pts[(i+n)%n] : pts[Math.max(0,Math.min(n-1,i))]; }
  var d="M "+fx(pts[0][0])+","+fx(pts[0][1]);
  var last=closed?n:n-1;
  for(var i=0;i<last;i++){
    var p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    d+=" C "+fx(p1[0]+(p2[0]-p0[0])/6)+","+fx(p1[1]+(p2[1]-p0[1])/6)+" "+
       fx(p2[0]-(p3[0]-p1[0])/6)+","+fx(p2[1]-(p3[1]-p1[1])/6)+" "+fx(p2[0])+","+fx(p2[1]);
  }
  if(closed) d+=" Z";
  return d;
}
function jitPts(pts,a){
  return pts.map(function(p){ return [p[0]+rr(-a,a), p[1]+rr(-a,a)]; });
}
function shape(g,pts,sw,col,fill){
  if(fill) el(g,"path",{d:crPath(jitPts(pts,0.7),true),fill:fill,stroke:"none"});
  for(var p=0;p<2;p++){
    el(g,"path",{d:crPath(jitPts(pts,p?1.6:0.9),true),fill:"none",
      "stroke-width":fx(sw*(p?rr(0.66,0.86):rr(0.94,1.12))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
  }
}
function curve(g,pts,sw,col,opt){
  opt=opt||{};
  var passes=opt.single?1:2;
  for(var p=0;p<passes;p++){
    el(g,"path",{d:crPath(jitPts(pts,p?1.5:0.8),false),fill:"none",
      "stroke-width":fx(sw*(p?rr(0.66,0.86):rr(0.92,1.14))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
  }
}
function arcPts(cx,cy,rx,ry,a0,a1,steps,jit){
  var out=[];
  for(var i=0;i<=steps;i++){
    var t=a0+(a1-a0)*i/steps;
    out.push([cx+rx*Math.cos(t)+rr(-jit,jit), cy+ry*Math.sin(t)+rr(-jit,jit)]);
  }
  return out;
}
// wobbly ellipse: open arc that overshoots its own start, drawn twice
function ovalR(g,cx,cy,rx,ry,sw,col){
  for(var p=0;p<2;p++){
    var a0=rr(0,6.28), a1=a0+Math.PI*2+rr(0.10,0.34);
    var k=rr(0.994,1.006);
    var rxx=rx*k+(p?rr(-2.2,2.2):0), ryy=ry*rr(0.988,1.012)+(p?rr(-1.6,1.6):0);
    el(g,"path",{d:crPath(arcPts(cx+rr(-1.5,1.5),cy+rr(-1.5,1.5),rxx,ryy,a0,a1,15,Math.min(1.9,ry*0.09)),false),
      fill:"none","stroke-width":fx(sw*(p?rr(0.62,0.84):rr(0.94,1.14))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
  }
}
function ringR(g,cx,cy,r,sw,col){ ovalR(g,cx,cy,r,r*rr(0.99,1.012),sw,col); }
// woodcut hatching: uneven spacing, uneven length, uneven angle
function hatch(g,x1,y1,x2,y2,n,stepx,stepy,sw,col){
  for(var i=0;i<n;i++){
    var k=i+rr(-0.22,0.22);
    var ax=x1+stepx*k, ay=y1+stepy*k;
    var bx=x2+stepx*k, by=y2+stepy*k;
    var t0=rr(0,0.16), t1=rr(0.82,1.04);
    var px=ax+(bx-ax)*t0, py=ay+(by-ay)*t0;
    var qx=ax+(bx-ax)*t1, qy=ay+(by-ay)*t1;
    line(g,px,py,qx,qy,sw*rr(0.85,1.2),col,{single:(rnd()<0.62),over:0});
  }
}

/* ================= PLATE + RING ================= */
var plate=G("L-plate"), ring=G("L-ring"), sc=G("L-scene"), orn=G("L-orn");
el(plate,"path",{d:crPath(arcPts(540,425,255,254,0,Math.PI*2,18,1.2),true),fill:CRM,stroke:"none"});
ringR(ring,540,425,357,8.4,INK);
ringR(ring,540,425,343,3.6,BRK);
ringR(ring,540,425,268,5.6,INK);
ringR(ring,540,425,257,2.7,INK);

/* type baselines, slightly out of round so the letters ride a hand-drawn curve */
G("arcTop").setAttribute("d",crPath(arcPts(540,426,283,281,Math.PI,Math.PI*2,20,1.5),false));
G("arcBot").setAttribute("d",crPath(arcPts(540,424,330,328,Math.PI,0,20,1.5),false));

/* ================= BACKGROUND: HILLS + TREE ================= */
curve(sc,[[300,438],[330,398],[364,362],[400,350],[432,376],[460,408],[478,426],[494,438]],5.0,INK);
curve(sc,[[324,436],[350,404],[380,388],[406,396],[424,414]],3.0,INK,{single:1});
curve(sc,[[596,436],[634,378],[668,340],[706,328],[742,362],[766,404],[782,436]],5.2,INK);
curve(sc,[[622,436],[654,392],[690,368],[722,382],[742,404]],3.0,INK,{single:1});
for(var i=0;i<9;i++){
  var hx=330+i*17, hy=424-Math.sin(i/9*Math.PI)*30;
  line(sc,hx,hy,hx+rr(6,10),hy+rr(7,11),2.6,INK,{single:1,over:0});
}
for(var i=0;i<9;i++){
  var hx2=628+i*14, hy2=420-Math.sin(i/9*Math.PI)*38;
  line(sc,hx2,hy2,hx2+rr(6,10),hy2+rr(8,12),2.6,INK,{single:1,over:0});
}
/* tree */
line(sc,734,470,731,398,9.0,INK);
line(sc,733,432,712,410,4.6,INK);
line(sc,734,420,754,400,4.2,INK);
/* scalloped canopy: lobes, not a balloon */
(function(){
  var lobes=[[708,366,27,25],[738,336,30,27],[760,364,24,22]];
  lobes.forEach(function(L){
    el(sc,"path",{d:crPath(arcPts(L[0],L[1],L[2]+2,L[3]+2,0,Math.PI*2,13,1.1),true),fill:CRM,stroke:"none"});
  });
  lobes.forEach(function(L){ ovalR(sc,L[0],L[1],L[2],L[3],4.8,INK); });
})();
for(var t=0;t<9;t++){
  var tx=702+t*8;
  line(sc,tx,rr(348,360),tx+rr(9,15),rr(368,382),2.7,INK,{single:1,over:0});
}
line(sc,726,318,742,306,2.6,INK,{single:1,over:0});
line(sc,748,330,764,344,2.6,INK,{single:1,over:0});

/* ================= HOUSE ================= */
/* cream masses first so the hills never read through the walls */
el(sc,"path",{d:crPath(jitPts([[384,384],[460,310],[540,232],[620,310],[696,384],[540,392]],1.2),true),fill:CRM,stroke:"none"});
el(sc,"path",{d:crPath(jitPts([[428,374],[540,372],[652,374],[652,456],[540,458],[428,456]],1.2),true),fill:CRM,stroke:"none"});
el(sc,"path",{d:crPath(jitPts([[334,456],[540,452],[746,456],[746,472],[540,474],[334,472]],1.2),true),fill:CRM,stroke:"none"});
el(sc,"path",{d:crPath(jitPts([[342,468],[540,466],[738,468],[738,548],[540,550],[342,548]],1.2),true),fill:CRM,stroke:"none"});

/* upper roof · thick tiled bands */
line(sc,393,380,540,236,8.6,INK);
line(sc,420,379,540,262,4.3,INK);
line(sc,687,380,541,236,8.6,INK);
line(sc,660,379,541,262,4.3,INK);
for(var k=0;k<10;k++){
  var tt=0.06+k*0.095+rr(-0.018,0.018);
  var ox=393+147*tt, oy=380-144*tt;
  var ix=420+120*tt, iy=379-117*tt;
  line(sc,ox,oy,ix,iy,3.3*rr(0.85,1.2),BRK,{single:(rnd()<0.55),over:0});
  line(sc,1080-ox+rr(-2,2),oy+rr(-2,2),1080-ix,iy,3.3*rr(0.85,1.2),BRK,{single:(rnd()<0.55),over:0});
}
line(sc,540,237,541,219,5.4,INK);
line(sc,528,224,553,223,4.0,INK);
line(sc,383,381,697,379,8.6,INK);
line(sc,390,392,690,390,3.3,INK);
line(sc,402,379,401,392,3.0,INK);
line(sc,540,379,541,392,3.0,INK);
line(sc,678,379,679,392,3.0,INK);

/* gable face + louvered vent */
curve(sc,[[423,378],[480,322],[540,265],[600,322],[657,378]],4.6,INK);
rectR(sc,496,304,88,58,4.8,INK);
for(var v=0;v<5;v++) line(sc,rr(499,502),315+v*10.8,rr(578,582),315+v*10.8+rr(-1,1),3.3,INK,{single:1,over:0});
line(sc,434,370,646,369,2.9,INK,{single:1});
line(sc,506,298,575,297,2.9,INK,{single:1});
line(sc,518,286,563,285,2.9,INK,{single:1});
for(var q=0;q<6;q++){
  line(sc,438+q*9,371-q*2,458+q*9,rr(336,344)-q*8,2.7,INK,{single:1,over:0});
  line(sc,642-q*9,371-q*2,622-q*9,rr(336,344)-q*8,2.7,INK,{single:1,over:0});
}

/* second floor wall */
line(sc,430,374,429,458,5.6,INK);
line(sc,650,374,651,458,5.6,INK);

/* window: casement pair, 3x2 panes */
function win(g,x,y,w,h){
  el(g,"path",{d:crPath(jitPts([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],1),true),fill:CRM,stroke:"none"});
  rectR(g,x,y,w,h,4.9,INK);
  rectR(g,x+5,y+5,w-10,h-10,2.9,INK);
  line(g,x+w/2,y+5,x+w/2+rr(-1.5,1.5),y+h-5,3.7,INK,{over:0});
  line(g,x+w/3,y+6,x+w/3+rr(-1.5,1.5),y+h-6,2.7,INK,{single:1,over:0});
  line(g,x+2*w/3,y+6,x+2*w/3+rr(-1.5,1.5),y+h-6,2.7,INK,{single:1,over:0});
  line(g,x+5,y+h/2,x+w-5,y+h/2+rr(-1.5,1.5),2.9,INK,{single:1,over:0});
  line(g,x-7,y+h+5,x+w+7,y+h+4,4.5,INK);
  line(g,x-4,y-5,x+w+4,y-6,3.5,INK);
  hatch(g,x+w-14,y+h-8,x+w-4,y+8,3,3.2,0,2.5,INK);
}
win(sc,458,390,68,54);
win(sc,554,390,68,54);

/* lap siding, only where the wall is bare */
function siding(g,x1,x2,y1,y2,step,skips){
  for(var y=y1;y<=y2;y+=step*rr(0.9,1.12)){
    var segs=[[x1,x2]];
    skips.forEach(function(sk){
      if(y>sk[1]-6 && y<sk[3]+12){
        var out=[];
        segs.forEach(function(sg){
          if(sk[2]<=sg[0]||sk[0]>=sg[1]){ out.push(sg); return; }
          if(sk[0]>sg[0]) out.push([sg[0],sk[0]-4]);
          if(sk[2]<sg[1]) out.push([sk[2]+4,sg[1]]);
        });
        segs=out;
      }
    });
    segs.forEach(function(sg){ if(sg[1]-sg[0]>8) line(g,sg[0]+rr(0,2),y,sg[1]-rr(0,2),y+rr(-1.2,1.2),2.6,INK,{single:1,over:0}); });
  }
}
siding(sc,433,647,386,450,11,[[452,384,532,450],[548,384,628,450]]);
siding(sc,455,626,478,542,11,[[460,480,544,544],[542,480,626,544]]);
siding(sc,640,734,478,542,11,[[646,470,720,552]]);

/* middle tier roof over the wings */
line(sc,334,463,746,461,9.2,INK);
line(sc,399,441,681,439,4.5,INK);
line(sc,335,462,400,440,5.5,INK);
line(sc,745,462,680,440,5.5,INK);
for(var m=0;m<17;m++){
  var mx=352+m*23+rr(-3,3);
  var topx=mx+(mx<400?10:(mx>680?-10:rr(-2,2)));
  line(sc,mx,461+rr(-1.5,1.5),topx,442+rr(-2,3),3.1*rr(0.85,1.2),BRK,{single:(rnd()<0.5),over:0});
}
line(sc,341,472,739,470,3.3,INK,{single:1});

/* ground floor · left wing open veranda */
line(sc,356,470,355,547,5.8,INK);
line(sc,398,470,399,547,5.1,INK);
line(sc,440,470,439,547,5.1,INK);
line(sc,351,512,445,511,4.5,INK);
for(var b=0;b<9;b++) line(sc,358+b*10.5+rr(-1.5,1.5),513,358+b*10.5+rr(-2,2),543,2.6,INK,{single:1,over:0});
line(sc,351,544,445,543,4.1,INK);
line(sc,362,503,434,502,2.8,INK,{single:1});
hatch(sc,360,500,360,470,5,9,0,2.5,INK);

/* ground floor · centre wall + windows */
line(sc,452,470,451,547,5.5,INK);
line(sc,628,470,629,547,5.5,INK);
win(sc,466,486,72,52);
win(sc,548,486,72,52);

/* right wing · double teak door + step */
line(sc,736,470,737,547,5.5,INK);
el(sc,"path",{d:crPath(jitPts([[652,476],[714,476],[714,546],[652,546]],1),true),fill:CRM,stroke:"none"});
rectR(sc,652,476,62,70,5.3,INK);
line(sc,683,476,682,547,4.1,INK);
rectR(sc,658,484,19,26,2.9,INK);
rectR(sc,689,484,19,26,2.9,INK);
rectR(sc,658,516,19,24,2.9,INK);
rectR(sc,689,516,19,24,2.9,INK);
line(sc,639,548,727,547,6.2,INK);
line(sc,645,556,721,555,3.3,INK,{single:1});

/* wall lanterns */
function lantern(g,x,y){
  line(g,x,y,x+8,y+rr(-1,1),3.3,INK,{single:1});
  line(g,x+8,y-6,x+8,y+2,3.1,INK,{single:1});
  el(g,"path",{d:crPath(jitPts([[x+1,y+2],[x+15,y+2],[x+12,y+18],[x+4,y+18]],0.8),true),fill:CRM,stroke:"none"});
  poly(g,[[x+1,y+2],[x+15,y+2],[x+12,y+18],[x+4,y+18]],3.5,INK,true);
  line(g,x+8,y+5,x+8,y+15,2.7,INK,{single:1,over:0});
  line(g,x+3,y+21,x+13,y+21,2.9,INK,{single:1});
}
lantern(sc,632,482); lantern(sc,722,482); lantern(sc,442,482); lantern(sc,540,394);
