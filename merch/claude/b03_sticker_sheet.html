<svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">

    </filter>
    <filter id="rough3" x="-16%" y="-16%" width="132%" height="132%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="47" result="n3"/>
      <feDisplacementMap in="SourceGraphic" in2="n3" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>

<script>
const NS='http://www.w3.org/2000/svg';
const INK='#241d19', BRICK='#b4451f', WOOD='#8a5a2b';
const svg=document.getElementById('s'), defs=document.getElementById('defs'),
      art=document.getElementById('art'), typeL=document.getElementById('type'),
      paper=document.getElementById('paper');
let _s=987654321;
function rn(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}
function jit(a){return (rn()-0.5)*2*a;}
function E(t,a,p){const e=document.createElementNS(NS,t);for(const k in (a||{}))e.setAttribute(k,a[k]);(p||art).appendChild(e);return e;}
function f(v){return (+v).toFixed(2);}
function rw(base){var w=base*(0.80+rn()*0.48)+jit(0.18);return +Math.max(1.05,Math.min(3.2,w)).toFixed(2);}
/* hand-drawn path: faint pencil underdraw + main stroke + offset second pass */
function P(p,d,s,col){
  s=(s==null?2:s); if(s<=0)return null;
  var c=col||INK, w=rw(s);
  if(rn()<0.42){
    E('path',{d:d,fill:'none',stroke:c,'stroke-width':f(w*0.85),opacity:f(0.15+rn()*0.10),
      transform:'translate('+f(jit(1.9))+','+f(jit(1.9))+')','stroke-linecap':'round','stroke-linejoin':'round'},p);
  }
  var el=E('path',{d:d,fill:'none',stroke:c,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round'},p);
  if(s>=1.5&&rn()<0.68){
    E('path',{d:d,fill:'none',stroke:c,'stroke-width':f(w*0.62),opacity:f(0.50+rn()*0.20),
      transform:'translate('+f(jit(1.4))+','+f(jit(1.4))+')','stroke-linecap':'round','stroke-linejoin':'round'},p);
  }
  return el;
}
/* line with overshoot at both ends + slight bow */
function L(p,x1,y1,x2,y2,s,col){
  s=(s==null?1.6:s);
  var dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
  var big=s>1.25;
  var o1=big?(1.8+rn()*3.2):(rn()*1.3), o2=big?(1.8+rn()*3.2):(rn()*1.3);
  var ax=x1-ux*o1, ay=y1-uy*o1, bx=x2+ux*o2, by=y2+uy*o2;
  var bow=jit(Math.min(2.2,len*0.014)+0.35);
  var mx=(ax+bx)/2-uy*bow, my=(ay+by)/2+ux*bow;
  return P(p,'M'+f(ax)+','+f(ay)+' Q'+f(mx)+','+f(my)+' '+f(bx)+','+f(by),s,col);
}
/* wobbly, slightly-unclosed circle */
function C(p,cx,cy,r,s,col){
  var n=Math.max(12,Math.round(r*1.1)+10), st=rn()*6.283, sweep=6.283+0.06+rn()*0.26, d='';
  for(var i=0;i<=n;i++){var a=st+sweep*i/n, rr=r*(1+jit(0.026))+jit(0.55);
    d+=(i?' L':'M')+f(cx+Math.cos(a)*rr)+','+f(cy+Math.sin(a)*rr);}
  return P(p,d,s==null?1.8:s,col);
}
function EL(p,cx,cy,rx,ry,s,col){
  var n=Math.max(14,Math.round((rx+ry)*0.5)+12), st=rn()*6.283, sweep=6.283+0.05+rn()*0.24, d='';
  for(var i=0;i<=n;i++){var a=st+sweep*i/n;
    d+=(i?' L':'M')+f(cx+Math.cos(a)*(rx*(1+jit(0.022))+jit(0.5)))+','+f(cy+Math.sin(a)*(ry*(1+jit(0.03))+jit(0.5)));}
  return P(p,d,s==null?1.8:s,col);
}
/* rectangle drawn as 4 overshooting strokes, never a perfect box */
function RC(p,x,y,w,h,s,col){
  L(p,x,y,x+w,y,s,col); L(p,x+w,y,x+w,y+h,s,col);
  L(p,x+w,y+h,x,y+h,s,col); L(p,x,y+h,x,y,s,col);
}
let uid=0;
function clipD(d){const id='cp'+(++uid);const cp=E('clipPath',{id:id},defs);E('path',{d:d},cp);return id;}
function bbox(p,d){const t=E('path',{d:d,fill:'none'},p);const b=t.getBBox();t.remove();return b;}
function hatch(p,d,o){
  o=o||{}; const id=clipD(d); const b=bbox(p,d);
  const cx=b.x+b.width/2, cy=b.y+b.height/2, R=Math.hypot(b.width,b.height)/2+8;
  const ang=(o.angle==null?45:o.angle)+jit(2.6);
  const gc=E('g',{'clip-path':'url(#'+id+')'},p);
  const g=E('g',{transform:'rotate('+f(ang)+' '+f(cx)+' '+f(cy)+')'},gc);
  const gap=o.gap||7, sw=o.sw||1.15, col=o.color||INK;
  var t=-R;
  while(t<=R){
    var y0=cy+t;
    var x1=cx-R+rn()*R*0.28, x2=cx+R-rn()*R*0.28;
    if(x2-x1<6){t+=gap;continue;}
    E('path',{d:'M'+f(x1)+','+f(y0+jit(1.3))+' Q'+f((x1+x2)/2)+','+f(y0+jit(2.6))+' '+f(x2)+','+f(y0+jit(1.3)),
      fill:'none',stroke:col,'stroke-width':f(sw*(0.72+rn()*0.68)),'stroke-linecap':'round',
      opacity:f(0.72+rn()*0.28)},g);
    t+=gap*(0.74+rn()*0.56);
  }
  return g;
}
function xhatch(p,d,o){o=o||{};hatch(p,d,o);hatch(p,d,{angle:(o.angle==null?45:o.angle)+82,gap:(o.gap||7)*1.2,sw:o.sw||1.1,color:o.color});}
function stip(p,d,n,r,col){
  const id=clipD(d); const b=bbox(p,d); const g=E('g',{'clip-path':'url(#'+id+')'},p);
  for(let i=0;i<n;i++){E('circle',{cx:b.x+rn()*b.width,cy:b.y+rn()*b.height,r:((r||1.1)*(0.65+rn()*0.7)).toFixed(2),fill:col||INK},g);}
  return g;
}
/* irregular hand-cut dash walker */
function walkDash(p,pts){
  var seg=[],total=0,k;
  for(k=0;k<pts.length-1;k++){var l=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);seg.push(l);total+=l;}
  function at(s){var acc=0;for(var i=0;i<seg.length;i++){if(acc+seg[i]>=s){var t=(s-acc)/seg[i];
    return [pts[i][0]+(pts[i+1][0]-pts[i][0])*t,pts[i][1]+(pts[i+1][1]-pts[i][1])*t];}acc+=seg[i];}
    return pts[pts.length-1];}
  var s=0;
  while(s<total){
    var dl=8+rn()*8, gp=5.5+rn()*5.5;
    var a=at(s), b=at(Math.min(s+dl,total));
    E('path',{d:'M'+f(a[0])+','+f(a[1])+' L'+f(b[0])+','+f(b[1]),fill:'none',stroke:INK,
      'stroke-width':f(1.25+rn()*0.85),'stroke-linecap':'round',opacity:f(0.36+rn()*0.24)},p);
    s+=dl+gp;
  }
}
function dieCut(p,x,y,w,h,r){
  r=(r==null?24:r);
  var pts=[],i,st=6, wob=1.9;
  function edge(x1,y1,x2,y2){var len=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.round(len/st));
    for(i=0;i<n;i++){var t=i/n;pts.push([x1+(x2-x1)*t+jit(wob),y1+(y2-y1)*t+jit(wob)]);}}
  function corner(ccx,ccy,a0){for(i=0;i<=6;i++){var a=a0+(Math.PI/2)*i/6;
    pts.push([ccx+Math.cos(a)*r+jit(wob),ccy+Math.sin(a)*r+jit(wob)]);}}
  edge(x+r,y,x+w-r,y);           corner(x+w-r,y+r,-Math.PI/2);
  edge(x+w,y+r,x+w,y+h-r);       corner(x+w-r,y+h-r,0);
  edge(x+w-r,y+h,x+r,y+h);       corner(x+r,y+h-r,Math.PI/2);
  edge(x,y+h-r,x,y+r);           corner(x+r,y+r,Math.PI);
  pts.push(pts[0]);
  walkDash(p,pts);
}
function dieCutCircle(p,cx,cy,r){
  var pts=[],n=Math.max(48,Math.round(r*1.4));
  for(var i=0;i<=n;i++){var a=6.283*i/n, rr=r*(1+jit(0.012))+jit(1.5);
    pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}
  walkDash(p,pts);
}

/* ---------- paper speckle ---------- */
(function(){const g=E('g',{opacity:'0.16'},paper);
for(let i=0;i<300;i++){E('circle',{cx:(rn()*1080).toFixed(1),cy:(rn()*1350).toFixed(1),r:(0.5+rn()*1.1).toFixed(2),fill:INK},g);}})();

/* ================= 1 · HOUSE ================= */
function house(g,W,H){

  P(g,hillD,2.2); hatch(g,hillD,{angle:72,gap:10,sw:1.0});
  P(g,'M16,214 q60,10 122,2 q70,-9 140,3 q80,10 150,-2 q40,-7 76,3',1.5);

  // ---- lower centre roof
  const roofC='M146,206 L260,130 L374,206 Z';
  P(g,'M142,212 L260,132 L378,212',2.8); P(g,'M148,204 L260,126 L372,204',2.0);
  hatch(g,roofC,{angle:-34,gap:6,sw:1.15,color:BRICK});
  hatch(g,roofC,{angle:56,gap:14,sw:0.9,color:BRICK});

  hatch(g,roofU,{angle:-38,gap:6,sw:1.1,color:BRICK});
  L(g,200,156,320,156,2.2);

  for(let i=1;i<6;i++){const y=152-i*6.2, hw=(y-114)/38*46*0+0; const half=(152-y)/38*46; L(g,260-(46-half*0)+0,y,260+46,y,0);}
  for(let i=1;i<6;i++){const y=152-i*6.3; const half=46*(y-114)/38; L(g,260-half,y,260+half,y,1.2);}
  // ---- centre wall
  const wallC='M176,200 L344,200 L344,300 L176,300 Z';
  P(g,wallC,2.4);
  for(let i=1;i<12;i++){L(g,177,200+i*8.4,343,200+i*8.4,1.0);}
  // windows 3x2
  [[190,218],[272,218]].forEach(function(w){

    RC(g,x,y,ww,hh,2.4);
    RC(g,x+4,y+4,ww-8,hh-8,1.3);
    L(g,x+4+(ww-8)/3,y+4,x+4+(ww-8)/3,y+hh-4,1.3);

    hatch(g,'M'+(x+4)+','+(y+4)+' L'+(x+4+(ww-8)/3)+','+(y+4)+' L'+(x+4+(ww-8)/3)+','+(y+hh/2)+' L'+(x+4)+','+(y+hh/2)+' Z',{angle:40,gap:5,sw:0.8});
    hatch(g,'M'+(x+4+2*(ww-8)/3)+','+(y+hh/2)+' L'+(x+ww-4)+','+(y+hh/2)+' L'+(x+ww-4)+','+(y+hh-4)+' L'+(x+4+2*(ww-8)/3)+','+(y+hh-4)+' Z',{angle:40,gap:5,sw:0.8});
  });
  // small door centre
  P(g,'M246,266 L246,300 L276,300 L276,266 Z',2.0);
  L(g,261,266,261,300,1.2); L(g,246,282,276,282,1.1);
  // ---- left wing (open veranda)
  P(g,'M52,240 L150,204',2.8); P(g,'M56,232 L150,198',1.6);
  hatch(g,'M52,240 L150,204 L152,212 L54,248 Z',{angle:-22,gap:6,sw:1.05,color:BRICK});
  P(g,'M52,240 L54,248 L152,212 L150,204 Z',2.0);
  [64,102,140].forEach(function(x){L(g,x,246-(x-52)*0.36,x,300,2.4,WOOD);});
  L(g,58,272,172,258,1.9);
  L(g,58,262,172,248,1.4);
  for(let i=0;i<11;i++){const x=62+i*10; L(g,x,272-(x-58)*0.123,x,300,1.1);}
  L(g,54,300,176,300,2.2);
  // lantern on left post
  P(g,'M96,214 L96,222 M90,222 L102,222 L104,238 L88,238 Z',1.6);
  L(g,90,230,102,230,1.0);
  // ---- right wing
  P(g,'M374,208 L470,242',2.8); P(g,'M372,200 L466,234',1.6);
  hatch(g,'M372,200 L466,234 L470,242 L374,208 Z',{angle:20,gap:6,sw:1.05,color:BRICK});
  P(g,'M372,200 L466,234 L470,242 L374,208 Z',1.9);
  P(g,'M376,240 L464,240 L464,300 L376,300 Z',2.4);
  for(let i=1;i<8;i++){L(g,377,240+i*7.5,463,240+i*7.5,1.0);}
  // double door
  RC(g,398,252,44,48,2.4);
  L(g,420,252,420,300,1.8);
  [0,1].forEach(function(k){
    const x=400+k*22;
    RC(g,x+3,256,15,18,1.2);

  P(g,canopy,2.6);

  for(let i=0;i<7;i++){const x=30+rn()*80,y=90+rn()*50;L(g,x,y,x+10,y-3,0.9);}
}

/* ================= 2 · ANTIQUE CLOCK ================= */
function clock(g,W,H){
  const cx=W/2;
  // horse figurine on top (side view)
  (function(){
    var hx=cx-2, hy=112;
    var body='M'+(hx-25)+','+(hy-33)+' C'+(hx-20)+','+(hy-43)+' '+(hx+4)+','+(hy-45)+' '+(hx+15)+','+(hy-41)+
             ' C'+(hx+20)+','+(hy-36)+' '+(hx+20)+','+(hy-28)+' '+(hx+18)+','+(hy-23)+
             ' L'+(hx-21)+','+(hy-21)+' C'+(hx-26)+','+(hy-24)+' '+(hx-27)+','+(hy-29)+' '+(hx-25)+','+(hy-33)+' Z';
    P(g,body,2.6,WOOD);
    hatch(g,body,{angle:56,gap:5,sw:0.9,color:WOOD});

      ' C'+(hx+30)+','+(hy-68)+' '+(hx+38)+','+(hy-63)+' '+(hx+36)+','+(hy-55)+
      ' C'+(hx+34)+','+(hy-50)+' '+(hx+27)+','+(hy-48)+' '+(hx+21)+','+(hy-47)+
      ' C'+(hx+17)+','+(hy-44)+' '+(hx+16)+','+(hy-42)+' '+(hx+18)+','+(hy-40)+' Z';
    P(g,head,2.4,WOOD);
    hatch(g,head,{angle:70,gap:5,sw:0.85,color:WOOD});
    C(g,hx+31,hy-59,1.6,1.6,WOOD);
    // ear + mane
    P(g,'M'+(hx+24)+','+(hy-64)+' l2,-8 l4,7',1.6,WOOD);
    P(g,'M'+(hx+10)+','+(hy-44)+' q6,-9 13,-16',1.4,WOOD);
    // legs (front pair / hind pair)
    P(g,'M'+(hx+13)+','+(hy-24)+' q2,12 1,23',2.4,WOOD);
    P(g,'M'+(hx+5)+','+(hy-23)+' q1,11 -1,22',1.7,WOOD);
    P(g,'M'+(hx-17)+','+(hy-22)+' q-2,12 0,23',2.4,WOOD);
    P(g,'M'+(hx-9)+','+(hy-22)+' q3,11 1,22',1.7,WOOD);
    // hooves
    L(g,hx+10,hy,hx+17,hy,2.0,WOOD); L(g,hx-20,hy,hx-13,hy,2.0,WOOD);
    // tail
    P(g,'M'+(hx-25)+','+(hy-35)+' C'+(hx-33)+','+(hy-30)+' '+(hx-34)+','+(hy-20)+' '+(hx-29)+','+(hy-11)+'',2.2,WOOD);
    P(g,'M'+(hx-25)+','+(hy-32)+' C'+(hx-31)+','+(hy-26)+' '+(hx-31)+','+(hy-18)+' '+(hx-27)+','+(hy-12)+'',1.3,WOOD);
  })();
  // crest / arched hood
  P(g,'M'+(cx-56)+',146 q0,-30 56,-30 q56,0 56,30 Z',2.9,INK);
  hatch(g,'M'+(cx-56)+',146 q0,-30 56,-30 q56,0 56,30 Z',{angle:-40,gap:6,sw:1.1,color:WOOD});
  P(g,'M'+(cx-48)+',144 q0,-22 48,-22 q48,0 48,22',1.5);
  // main case
  P(g,'M'+(cx-58)+',146 L'+(cx+58)+',146 L'+(cx+58)+',312 L'+(cx-58)+',312 Z',3.0);
  P(g,'M'+(cx-50)+',156 L'+(cx+50)+',156 L'+(cx+50)+',302 L'+(cx-50)+',302 Z',1.5);
  xhatch(g,'M'+(cx-58)+',146 L'+(cx-50)+',146 L'+(cx-50)+',312 L'+(cx-58)+',312 Z',{angle:38,gap:5,sw:0.85,color:WOOD});
  xhatch(g,'M'+(cx+50)+',146 L'+(cx+58)+',146 L'+(cx+58)+',312 L'+(cx+50)+',312 Z',{angle:38,gap:5,sw:0.85,color:WOOD});
  // dial
  C(g,cx,196,40,2.8);

  const nodes=[[cx+40,96],[cx+34,124],[cx+30,152],[cx+26,182],[cx+22,212],[cx+19,242],[cx+16,270],[cx+14,296],[cx+12,320]];
  nodes.forEach(function(n,i){

      if(k%3===0){L(g,bx,by+3,bx+dir*5,by+9,1.0,WOOD);}

    const d2='M'+n[0]+','+n[1]+' q'+(dir*len*0.30)+','+(drop*0.55)+' '+(dir*len*0.46)+','+(drop*1.25);

  EL(g,cx+38,352,30,7,1.3);
}

    RC(gg,ox,oy,s,s,3.0);

    const pos={1:[[0.5,0.5]],2:[[0.28,0.28],[0.72,0.72]],3:[[0.26,0.26],[0.5,0.5],[0.74,0.74]],
      4:[[0.29,0.29],[0.71,0.29],[0.29,0.71],[0.71,0.71]],

    pos[pips].forEach(function(p){

      hatch(gg,'M'+(ox+p[0]*s-r)+','+(oy+p[1]*s)+' a'+r+','+r+' 0 1 0 '+(r*2)+',0 a'+r+','+r+' 0 1 0 '+(-r*2)+',0 Z',{angle:44,gap:2.8,sw:0.8});
    });
    // corner shading
    hatch(gg,'M'+(ox+s*0.62)+','+(oy+s)+' L'+(ox+s)+','+(oy+s)+' L'+(ox+s)+','+(oy+s*0.6)+' Z',{angle:36,gap:5,sw:0.9,color:WOOD});
  }
  die(cx-84,58,86,-8,5);
  die(cx+4,116,72,12,3);
  die(cx-70,166,58,20,2);
  // wooden pawns
  function pawn(px,py,sc){
    EL(g,px,py,18*sc,6*sc,2.4);
    P(g,'M'+(px-17*sc)+','+py+' C'+(px-14*sc)+','+(py-16*sc)+' '+(px-8*sc)+','+(py-22*sc)+' '+(px-7*sc)+','+(py-31*sc)+

    hatch(g,'M'+(px-17*sc)+','+py+' C'+(px-14*sc)+','+(py-16*sc)+' '+(px-8*sc)+','+(py-22*sc)+' '+(px-7*sc)+','+(py-31*sc)+
      ' L'+(px+7*sc)+','+(py-31*sc)+' C'+(px+8*sc)+','+(py-22*sc)+' '+(px+14*sc)+','+(py-16*sc)+' '+(px+17*sc)+','+py+' Z',{angle:66,gap:6,sw:1.0,color:WOOD});
    EL(g,px,py-32*sc,8*sc,3.2*sc,1.8);
    C(g,px,py-42*sc,10*sc,2.8);
    hatch(g,'M'+(px-10*sc)+','+(py-42*sc)+' a'+(10*sc)+','+(10*sc)+' 0 1 0 '+(20*sc)+',0 a'+(10*sc)+','+(10*sc)+' 0 1 0 '+(-20*sc)+',0 Z',{angle:48,gap:4.5,sw:0.9,color:WOOD});
    L(g,px-13*sc,py-3*sc,px+13*sc,py-3*sc,1.3);
  }
  pawn(cx-62,336,1.55);
  pawn(cx+40,320,1.15);
  // table line + shadow
  L(g,26,354,W-26,354,2.2);
  hatch(g,'M30,354 L'+(W-30)+',354 L'+(W-46)+',376 L46,376 Z',{angle:26,gap:6,sw:0.95});
  // tiny meeple-free tokens
  [[cx+72,286,12],[cx+86,262,9]].forEach(function(t){
    C(g,t[0],t[1],t[2],2.4);
    hatch(g,'M'+(t[0]-t[2])+','+t[1]+' a'+t[2]+','+t[2]+' 0 1 0 '+(t[2]*2)+',0 a'+t[2]+','+t[2]+' 0 1 0 '+(-t[2]*2)+',0 Z',{angle:48,gap:4,sw:0.85,color:BRICK});
  });
