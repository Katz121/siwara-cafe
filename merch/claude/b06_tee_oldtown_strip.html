<script>
(function(){
var SVG="http://www.w3.org/2000/svg";
var INK="#241d19", BRK="#b4451f", CRM="#f4ece0";
var seed=13572468;
function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
function rr(a,b){ return a+rnd()*(b-a); }
function G(id){ return document.getElementById(id); }
function el(g,tag,at){ var e=document.createElementNS(SVG,tag); for(var k in at) e.setAttribute(k,at[k]); g.appendChild(e); return e; }
function fx(n){ return (Math.round(n*10)/10); }

/* ---------- hand-drawn primitives ---------- */
function line(g,x1,y1,x2,y2,sw,col,opt){
  opt=opt||{};
  var dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1;
  var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
  var over=(opt.over===undefined)?1:opt.over;
  var passes=(opt.single)?1:2;
  var bowMax=Math.min(2.2, 0.6+L*0.02);
  for(var p=0;p<passes;p++){
    var o1=over?rr(1.5,4.6):rr(0,1), o2=over?rr(1.8,5.0):rr(0,1);
    var off=(p===0)?0:(rnd()<0.5?-1:1)*rr(0.8,1.8);
    var sx=x1-ux*o1+nx*off+rr(-0.8,0.8), sy=y1-uy*o1+ny*off+rr(-0.8,0.8);
    var ex=x2+ux*o2+nx*off+rr(-0.8,0.8), ey=y2+uy*o2+ny*off+rr(-0.8,0.8);
    var b1=rr(-bowMax,bowMax), b2=rr(-bowMax,bowMax);
    el(g,"path",{d:"M "+fx(sx)+","+fx(sy)+" C "+fx(sx+(ex-sx)/3+nx*b1)+","+fx(sy+(ey-sy)/3+ny*b1)+" "+
      fx(sx+(ex-sx)*2/3+nx*b2)+","+fx(sy+(ey-sy)*2/3+ny*b2)+" "+fx(ex)+","+fx(ey),
      "stroke-width":fx(sw*(p===0?rr(0.92,1.14):rr(0.66,0.86))), stroke:col||INK,
      "stroke-opacity":(p===0?1:fx(rr(0.5,0.7)))});
  }
}
function poly(g,pts,sw,col,closed){
  for(var i=0;i<pts.length-1;i++) line(g,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],sw*rr(0.9,1.12),col);
  if(closed) line(g,pts[pts.length-1][0],pts[pts.length-1][1],pts[0][0],pts[0][1],sw*rr(0.9,1.12),col);
}
function rectR(g,x,y,w,h,sw,col){ poly(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],sw,col,true); }
function crPath(pts,closed){
  var n=pts.length;
  function at(i){ return closed? pts[(i+n)%n] : pts[Math.max(0,Math.min(n-1,i))]; }
  var d="M "+fx(pts[0][0])+","+fx(pts[0][1]);
  var last=closed?n:n-1;
  for(var i=0;i<last;i++){
    var p0=at(i-1),p1=at(i),p2=at(i+1),p3=at(i+2);
    d+=" C "+fx(p1[0]+(p2[0]-p0[0])/6)+","+fx(p1[1]+(p2[1]-p0[1])/6)+" "+
       fx(p2[0]-(p3[0]-p1[0])/6)+","+fx(p2[1]-(p3[1]-p1[1])/6)+" "+fx(p2[0])+","+fx(p2[1]);
  }
  if(closed) d+=" Z";
  return d;
}
function jitPts(pts,a){ return pts.map(function(p){ return [p[0]+rr(-a,a), p[1]+rr(-a,a)]; }); }
function fill(g,pts,col){ el(g,"path",{d:crPath(jitPts(pts,0.8),true),fill:col,stroke:"none"}); }
function shape(g,pts,sw,col,fl){
  if(fl) fill(g,pts,fl);
  for(var p=0;p<2;p++)
    el(g,"path",{d:crPath(jitPts(pts,p?1.6:0.9),true),fill:"none",
      "stroke-width":fx(sw*(p?rr(0.66,0.86):rr(0.94,1.12))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
}
function curve(g,pts,sw,col,opt){
  opt=opt||{};
  for(var p=0;p<(opt.single?1:2);p++)
    el(g,"path",{d:crPath(jitPts(pts,p?1.5:0.8),false),fill:"none",
      "stroke-width":fx(sw*(p?rr(0.66,0.86):rr(0.92,1.14))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
}
function arcPts(cx,cy,rx,ry,a0,a1,steps,jit){
  var o=[];
  for(var i=0;i<=steps;i++){ var t=a0+(a1-a0)*i/steps; o.push([cx+rx*Math.cos(t)+rr(-jit,jit), cy+ry*Math.sin(t)+rr(-jit,jit)]); }
  return o;
}
function ovalR(g,cx,cy,rx,ry,sw,col){
  for(var p=0;p<2;p++){
    var a0=rr(0,6.28), a1=a0+Math.PI*2+rr(0.10,0.34), k=rr(0.994,1.006);
    el(g,"path",{d:crPath(arcPts(cx+rr(-1.2,1.2),cy+rr(-1.2,1.2),rx*k+(p?rr(-1.8,1.8):0),ry*rr(0.99,1.01)+(p?rr(-1.4,1.4):0),a0,a1,14,Math.min(1.6,ry*0.1)),false),
      fill:"none","stroke-width":fx(sw*(p?rr(0.62,0.84):rr(0.94,1.14))),stroke:col||INK,
      "stroke-opacity":(p?fx(rr(0.5,0.7)):1)});
  }
}
function hatch(g,x1,y1,x2,y2,n,sx,sy,sw,col){
  for(var i=0;i<n;i++){
    var k=i+rr(-0.22,0.22);
    var ax=x1+sx*k, ay=y1+sy*k, bx=x2+sx*k, by=y2+sy*k;
    var t0=rr(0,0.16), t1=rr(0.82,1.04);
    line(g,ax+(bx-ax)*t0,ay+(by-ay)*t0,ax+(bx-ax)*t1,ay+(by-ay)*t1,sw*rr(0.85,1.2),col,{single:(rnd()<0.6),over:0});
  }
}

var B=G("S-build"), T=G("S-teak"), P=G("S-pole"), R=G("S-rule");

/* ================= STREET LINE ================= */
line(B,84,622,996,619,8.4,INK);
line(B,92,634,988,631,3.4,INK);
hatch(B,110,640,124,628,26,33,0,2.6,INK);

/* ================= SHINO-PORTUGUESE SHOPHOUSE BAYS ================= */
function shutterWindow(g,cx,y,w,h,slats){
  var x=cx-w/2;
  fill(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],CRM);
  /* arched head */
  curve(g,[[x-3,y+16],[x+w*0.18,y+1],[cx,y-6],[x+w*0.82,y+1],[x+w+3,y+16]],4.6,INK);
  line(g,x,y+16,x-1,y+h,5.0,INK);
  line(g,x+w,y+16,x+w+1,y+h,5.0,INK);
  line(g,x-6,y+h,x+w+6,y+h+1,5.2,INK);
  line(g,cx,y+4,cx,y+h-3,3.6,INK,{over:0});
  for(var s=0;s<slats;s++){
    var sy=y+18+s*((h-24)/(slats-1));
    line(g,x+4,sy,cx-4,sy+rr(-1.2,1.2),2.7,INK,{single:1,over:0});
    line(g,cx+4,sy+rr(-1.5,1.5),x+w-4,sy+rr(-1.2,1.2),2.7,INK,{single:1,over:0});
  }
  /* sill + brackets */
  line(g,x-9,y+h+9,x+w+9,y+h+8,4.4,INK);
  line(g,x+4,y+h+2,x+2,y+h+9,2.8,INK,{single:1,over:0});
  line(g,x+w-4,y+h+2,x+w-2,y+h+9,2.8,INK,{single:1,over:0});
}
function stuccoVent(g,cx,y,w,h,kind){
  var x=cx-w/2;
  fill(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],CRM);
  rectR(g,x,y,w,h,4.2,INK);
  if(kind===0){ for(var i=1;i<4;i++) line(g,x+w*i/4,y+3,x+w*i/4+rr(-1.5,1.5),y+h-3,3.0,INK,{over:0}); }
  else if(kind===1){ for(var i=1;i<3;i++) line(g,x+3,y+h*i/3,x+w-3,y+h*i/3+rr(-1,1),3.0,INK,{over:0});
                     line(g,x+w/2,y+3,x+w/2,y+h-3,3.0,INK,{over:0}); }
  else { line(g,x+3,y+3,x+w-3,y+h-3,3.0,INK,{over:0}); line(g,x+w-3,y+3,x+3,y+h-3,3.0,INK,{over:0});
         ovalR(g,cx,y+h/2,w*0.18,h*0.3,2.7,INK); }
}
function bay(g,x0,x1,par,kind){
  var w=x1-x0, cx=(x0+x1)/2;
  /* wall mass */
  fill(g,[[x0,par+2],[x1,par+2],[x1,622],[x0,622]],CRM);
  /* party walls */
  line(g,x0,622,x0-1,par+4,6.2,INK);
  line(g,x1,622,x1+1,par+4,6.2,INK);
  /* parapet crown, different silhouette per bay */
  if(kind===0){
    poly(g,[[x0-6,par+16],[x0-6,par],[x0+w*0.3,par],[x0+w*0.3,par-13],[x1-w*0.3,par-13],[x1-w*0.3,par],[x1+6,par],[x1+6,par+16]],5.6,INK);
  }else if(kind===1){
    curve(g,[[x0-6,par+16],[x0-4,par-2],[cx-w*0.22,par-16],[cx,par-21],[cx+w*0.22,par-16],[x1+4,par-2],[x1+6,par+16]],5.6,INK);
  }else if(kind===2){
    poly(g,[[x0-6,par+16],[x0-6,par-2],[cx-w*0.26,par-2],[cx,par-22],[cx+w*0.26,par-2],[x1+6,par-2],[x1+6,par+16]],5.6,INK);
  }else{
    poly(g,[[x0-6,par+16],[x0-6,par-4],[x0+w*0.22,par-4],[x0+w*0.22,par-15],[x0+w*0.38,par-15],[x0+w*0.38,par-24],
            [x1-w*0.38,par-24],[x1-w*0.38,par-15],[x1-w*0.22,par-15],[x1-w*0.22,par-4],[x1+6,par-4],[x1+6,par+16]],5.6,INK);
  }
  /* cornice */
  line(g,x0-9,par+30,x1+9,par+28,6.0,INK);
  line(g,x0-6,par+40,x1+6,par+38,3.0,INK);
  hatch(g,x0+4,par+38,x0+4,par+31,Math.round(w/16),16,0,2.5,INK);
  /* stucco air vent above the windows */
  stuccoVent(g,cx,par+50,Math.min(74,w*0.42),22,kind%3);
  /* upper floor louvered casements */
  shutterWindow(g,x0+w*0.29,330,56,96,6);
  shutterWindow(g,x0+w*0.71,330,56,96,6);
  /* pilaster between them */
  line(g,cx,par+78,cx,452,3.4,INK);
  line(g,cx+7,par+84,cx+7,450,2.6,INK,{single:1});
  /* awning */
  line(g,x0-2,454,x1+2,452,4.4,INK);
  line(g,x0-10,478,x1+10,476,7.0,INK);
  line(g,x0-2,454,x0-10,478,4.6,INK);
  line(g,x1+2,452,x1+10,476,4.6,INK);
  for(var a=0;a<Math.round(w/20);a++){
    var ax=x0+8+a*20+rr(-2,2);
    line(g,ax,454,ax-rr(5,9),476,2.8,BRK,{single:(rnd()<0.5),over:0});
  }
  hatch(g,x0+8,492,x0+8,480,Math.round(w/14),14,0,2.5,INK);
  /* old shop signboard: worn marks only, no lettering */
  fill(g,[[x0+18,496],[x1-18,496],[x1-18,528],[x0+18,528]],CRM);
  rectR(g,x0+18,496,w-36,32,4.8,INK);
  var marks=Math.max(3,Math.round(w/34));
  for(var mm=0;mm<marks;mm++){
    var mx=x0+34+mm*((w-70)/(marks-1));
    line(g,mx,rr(505,508),mx+rr(-2,2),rr(518,521),rr(4.2,6.4),INK,{over:0});
  }
  ovalR(g,x0+24,512,3.2,3.2,2.6,INK);
  ovalR(g,x1-24,512,3.2,3.2,2.6,INK);
  /* shopfront: arched opening, folding wooden doors */
  var ox=x0+16, ow=w-32;
  fill(g,[[ox,540],[ox+ow,540],[ox+ow,622],[ox,622]],CRM);
  curve(g,[[ox,556],[ox+ow*0.2,542],[ox+ow/2,536],[ox+ow*0.8,542],[ox+ow,556]],5.2,INK);
  line(g,ox,556,ox-1,620,5.4,INK);
  line(g,ox+ow,556,ox+ow+1,620,5.4,INK);
  var leaves=Math.round(ow/17);
  for(var d=1;d<leaves;d++){
    var dx=ox+ow*d/leaves;
    line(g,dx,rr(548,556),dx+rr(-2,2),rr(614,620),2.8,INK,{single:(rnd()<0.35),over:0});
  }
  line(g,ox-8,620,ox+ow+8,618,6.0,INK);
  hatch(g,ox+6,566,ox+26,546,4,13,0,2.6,INK);
  hatch(g,ox+ow-6,566,ox+ow-26,546,4,-13,0,2.6,INK);
  /* base plinth */
  line(g,x0-4,612,x0+16,611,3.0,INK,{single:1});
  line(g,x1+4,612,x1-16,611,3.0,INK,{single:1});
}
bay(B,96,262,258,0);
bay(B,262,428,246,1);
bay(B,428,594,264,2);
bay(B,594,752,252,3);

/* ================= TEAK HOUSE OF THE CAFE, RIGHT END ================= */
(function(){
  var g=T, x0=752, x1=992, cx=872;
  fill(g,[[x0-4,396],[cx,268],[x1+4,396],[x1,622],[x0,622]],CRM);
  /* gable roof with tile bands */
  line(g,748,398,872,266,8.8,INK);
  line(g,776,396,872,294,4.4,INK);
  line(g,996,398,873,266,8.8,INK);
  line(g,968,396,873,294,4.4,INK);
  for(var k=0;k<9;k++){
    var t=0.08+k*0.104+rr(-0.02,0.02);
    var ox=748+124*t, oy=398-132*t, ix=776+96*t, iy=396-102*t;
    line(g,ox,oy,ix,iy,3.3*rr(0.85,1.2),BRK,{single:(rnd()<0.55),over:0});
    line(g,1744-ox,oy+rr(-2,2),1744-ix,iy,3.3*rr(0.85,1.2),BRK,{single:(rnd()<0.55),over:0});
  }
  line(g,872,266,873,248,5.4,INK);
  line(g,860,253,885,252,4.0,INK);
  line(g,740,400,1004,398,8.6,INK);
  line(g,748,411,996,409,3.3,INK);
  line(g,760,398,759,411,3.0,INK);
  line(g,872,398,873,411,3.0,INK);
  line(g,984,398,985,411,3.0,INK);
  /* gable louver */
  curve(g,[[790,396],[830,352],[872,308],[914,352],[954,396]],4.6,INK);
  rectR(g,842,326,60,44,4.8,INK);
  for(var v=0;v<4;v++) line(g,rr(845,848),336+v*10,rr(896,900),336+v*10+rr(-1,1),3.2,INK,{single:1,over:0});
  line(g,800,388,944,387,2.9,INK,{single:1});
  hatch(g,806,392,824,364,5,10,0,2.6,INK);
  hatch(g,938,392,920,364,5,-10,0,2.6,INK);
  /* wall */
  line(g,x0,412,x0-1,622,6.0,INK);
  line(g,x1,412,x1+1,622,6.0,INK);
  /* windows 3x2 */
  function win(x,y,w,h){
    fill(g,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],CRM);
    rectR(g,x,y,w,h,4.9,INK);
    rectR(g,x+5,y+5,w-10,h-10,2.9,INK);
    line(g,x+w/2,y+5,x+w/2+rr(-1.5,1.5),y+h-5,3.7,INK,{over:0});
    line(g,x+w/3,y+6,x+w/3+rr(-1.5,1.5),y+h-6,2.7,INK,{single:1,over:0});
    line(g,x+2*w/3,y+6,x+2*w/3+rr(-1.5,1.5),y+h-6,2.7,INK,{single:1,over:0});
    line(g,x+5,y+h/2,x+w-5,y+h/2+rr(-1.5,1.5),2.9,INK,{single:1,over:0});
    line(g,x-7,y+h+6,x+w+7,y+h+5,4.5,INK);
    line(g,x-4,y-5,x+w+4,y-6,3.5,INK);
  }
  win(772,432,60,48);
  win(912,432,60,48);
  /* mid band */
  line(g,744,504,1000,502,7.2,INK);
  line(g,752,514,992,512,3.2,INK);
  for(var m=0;m<11;m++){
    var mx=756+m*23+rr(-3,3);
    line(g,mx,503,mx+rr(-3,3),486,3.0*rr(0.85,1.2),BRK,{single:(rnd()<0.5),over:0});
  }
  /* ground floor: double teak door + veranda posts + lantern */
  line(g,790,516,789,620,5.0,INK);
  line(g,956,516,957,620,5.0,INK);
  fill(g,[[840,528],[906,528],[906,620],[840,620]],CRM);
  rectR(g,840,528,66,92,5.3,INK);
  line(g,873,528,872,620,4.1,INK);
  rectR(g,846,538,22,32,2.9,INK);
  rectR(g,878,538,22,32,2.9,INK);
  rectR(g,846,578,22,32,2.9,INK);
  rectR(g,878,578,22,32,2.9,INK);
  line(g,830,621,916,619,6.2,INK);
  line(g,836,630,910,628,3.3,INK,{single:1});
  win(798,548,34,40);
  win(916,548,34,40);
  /* lantern by the door */
  (function(x,y){
    line(g,x,y,x+8,y+rr(-1,1),3.3,INK,{single:1});
    line(g,x+8,y-7,x+8,y+2,3.1,INK,{single:1});
