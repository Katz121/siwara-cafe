<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
<defs>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chonburi&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap');
        .text-main { font-family: 'Chonburi', serif; fill: #241d19; text-anchor: middle; }
        .text-sub { font-family: 'Noto Sans Thai', sans-serif; fill: #241d19; text-anchor: middle; letter-spacing: 0.5px; }
        .text-eng { font-family: 'Noto Sans Thai', sans-serif; font-weight: 700; fill: #241d19; text-anchor: middle; letter-spacing: 2px; }
        .ink { fill: none; stroke: #241d19; stroke-linecap: round; stroke-linejoin: round; }
        .thick { stroke-width: 3.2; }
        .med { stroke-width: 2.2; }
        .thin { stroke-width: 1.5; }
        .brick { stroke: #b4451f; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .teak { stroke: #8a5a2b; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .bg { fill: #f4ece0; }
    </style>
    <filter id="handDrawn" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</defs>

<rect width="1080" height="1350" class="bg" />

