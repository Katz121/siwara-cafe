name = "takuapa101-news"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every six hours. Cloudflare cron runs in UTC.
[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "NEWS"
id = "eec7fc96311e4e3b8186ce9750eb9d26"
preview_id = "e97e3b1e2c4646698fa9e4c16355568d"

[vars]
ALLOWED_ORIGINS = "https://takuapa101.com,https://takuapa101.pages.dev,http://127.0.0.1:8091"
MAX_ITEMS = "60"
MIN_CONFIDENCE = "75"
MAX_REVIEWS_PER_RUN = "20"

# Stage two reviewer. Uses Workers AI unless ANTHROPIC_API_KEY is set as a secret.
[ai]
binding = "AI"
