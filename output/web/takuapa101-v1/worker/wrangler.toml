name = "takuapa101-news"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every six hours. Cloudflare cron runs in UTC.
[triggers]
crons = ["0 */6 * * *"]

[[kv_namespaces]]
binding = "NEWS"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[vars]
ALLOWED_ORIGINS = "https://siwaracafe.com,http://127.0.0.1:8091"
MAX_ITEMS = "60"
