name = "takuapa101-redirect"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The guide used to live under siwaracafe.com/takuapa/. This keeps those links
# working and hands the ranking to the new domain with a 301.
routes = [
  { pattern = "siwaracafe.com/takuapa", zone_name = "siwaracafe.com" },
  { pattern = "siwaracafe.com/takuapa/*", zone_name = "siwaracafe.com" },
]

[vars]
SITE_ORIGIN = "https://takuapa101.com"
BASE_PATH = "/takuapa"
